                #                AWS:
                #                  - 'arn:aws:iam::${env:ACCOUNT_ID}:role/devHelloRetailWebIdentity'    
                #      DependsOn:
                #        - HelloRetailWebBucket
    MyOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "Access identity for S3 bucket"

    HelloRetailWebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - Id: ${custom.originId}
              DomainName: hello-retail.biz.s3.amazonaws.com
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${MyOriginAccessIdentity}"
          Enabled: true
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /error.html
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
            TargetOriginId: ${custom.originId}
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            ViewerProtocolPolicy: allow-all
      DependsOn:
        - HelloRetailWebBucket

  Outputs:
    WebApplicationIdentityArn:
      Description: The Role ARN for the Web Application identity
      Value:
        Fn::GetAtt: [ WebApplicationIdentity, Arn ]
      Export:
        Name: hello-retail-website:dev:WebApplicationIdentityArn
    WebApplicationBucketName:
      Description: The S3 Bucket ARN used to host Web Application
      Value:
        Ref: HelloRetailWebBucket
      Export:
        Name: hello-retail-website:dev:WebApplicationBucketName

